name: Build APK

on:
  push:
    branches: [main, 'claude/**']
    # Don't spend build minutes when only documents change.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tool/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create android folder if missing
        run: |
          if [ ! -d android ]; then
            flutter create --org com.faisal --project-name mepco_meter_app --platforms android .
          fi

      - name: Get packages
        run: flutter pub get

      - name: Generate drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Set up release signing (only if secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "Release signing key found."
          else
            echo "No signing secrets: the APK is signed with a debug key."
          fi

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Automatic build from `${{ github.ref_name }}` (commit ${{ github.sha }}).
            Download **app-release.apk** below and open it on your phone to install.
          files: build/app/outputs/flutter-apk/app-release.apk

      # Keep only the newest APK: delete older releases, their tags and any
      # stored workflow artifacts, so the repository stays small.
      - name: Remove old releases and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP: build-${{ github.run_number }}
        run: |
          gh release list --repo "$REPO" --limit 100 --json tagName --jq '.[].tagName' |
          while read -r tag; do
            if [ "$tag" != "$KEEP" ]; then
              echo "Deleting release $tag"
              gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag
            fi
          done
          gh api "repos/$REPO/actions/artifacts" --paginate --jq '.artifacts[].id' |
          while read -r id; do
            echo "Deleting artifact $id"
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id"
          done
